<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segnalazione Veicolo</title>
<style>
  body { font-family: -apple-system, Roboto, Arial, sans-serif; text-align:center;
         padding:36px 20px; color:#222; }
  .bus { font-size:48px; font-weight:bold; margin:8px 0; }
  .ts  { color:#666; margin-bottom:6px; }
  .geo { color:#888; font-size:14px; min-height:20px; margin-bottom:20px; }
  .cidbox { max-width:320px; margin:0 auto 8px; text-align:left; }
  .cidbox label { font-size:14px; color:#444; display:block; margin-bottom:4px; }
  #cid { width:100%; box-sizing:border-box; padding:14px; font-size:22px;
         text-align:center; letter-spacing:4px; border:2px solid #ccc;
         border-radius:12px; }
  #cid.ok  { border-color:#25D366; }
  #cid.bad { border-color:#e24b4a; }
  .hint { font-size:13px; min-height:18px; margin:6px auto 22px; max-width:320px; }
  .hint.err { color:#c0392b; } .hint.ok { color:#1e8e4e; }
  a.btn { display:block; max-width:320px; margin:12px auto; padding:16px;
          border-radius:12px; text-decoration:none; color:#fff; font-size:18px; }
  .wa { background:#25D366; } .mail { background:#1a73e8; }
  a.disabled { opacity:.45; pointer-events:none; }
</style>
</head>
<body>
  <div>Veicolo sociale</div>
  <div class="bus" id="bus">—</div>
  <div class="ts"  id="ts"></div>
  <div class="geo" id="geo">📍 Rilevamento posizione…</div>

  <div class="cidbox">
    <label for="cid">Codice matricola CID (7 cifre)</label>
    <input id="cid" inputmode="numeric" maxlength="7" autocomplete="off"
           placeholder="0000000" aria-describedby="hint">
  </div>
  <div class="hint err" id="hint">Inserisci il CID per abilitare l’invio</div>

  <a class="btn wa   disabled" id="waBtn"   href="#">📲 Invia con WhatsApp</a>
  <a class="btn mail disabled" id="mailBtn" href="#">✉️ Invia con Email</a>

<script>
  // ---- CONFIGURAZIONE FISSA ----
  const EMAIL    = "g.vasta@fsbusitalia.it";
  const WHATSAPP = "393371115747";   // prefisso 39, senza + e senza spazi
  // -------------------------------

  const params = new URLSearchParams(location.search);
  const bus = params.get("n") || "sconosciuto";

  const now = new Date();
  const ts = now.toLocaleString("it-IT", {
    day:"2-digit", month:"2-digit", year:"numeric",
    hour:"2-digit", minute:"2-digit", second:"2-digit"
  });

  document.getElementById("bus").textContent = bus;
  document.getElementById("ts").textContent  = "Rilevato il " + ts;

  let posLine = "";   // riga posizione, riempita in modo asincrono
  let geoReady = false;
  let cid = "";

  const cidInput = document.getElementById("cid");
  const hint = document.getElementById("hint");
  const wa   = document.getElementById("waBtn");
  const mail = document.getElementById("mailBtn");

  function buildMessage() {
    let m = `Veicolo sociale: ${bus}\nCID:${cid}\nData/ora: ${ts}`;
    if (posLine) m += "\n" + posLine;
    return m;
  }

  function updateLinks() {
    const msg = buildMessage();
    wa.href   = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
    mail.href = `mailto:${EMAIL}?subject=${encodeURIComponent("Segnalazione Bus " + bus)}`
              + `&body=${encodeURIComponent(msg)}`;
  }

  function refreshState() {
    const cidOk = /^\d{7}$/.test(cid);
    cidInput.classList.toggle("ok",  cidOk);
    cidInput.classList.toggle("bad", cid.length > 0 && !cidOk);

    if (!cidOk) {
      hint.className = "hint err";
      hint.textContent = cid.length === 0
        ? "Inserisci il CID per abilitare l’invio"
        : `CID incompleto: ${cid.length}/7 cifre`;
    } else if (!geoReady) {
      hint.className = "hint";
      hint.textContent = "Rilevamento posizione in corso…";
    } else {
      hint.className = "hint ok";
      hint.textContent = "Pronto per l’invio";
    }

    const enabled = cidOk && geoReady;
    wa.classList.toggle("disabled",   !enabled);
    mail.classList.toggle("disabled", !enabled);
    if (cidOk) updateLinks();
  }

  cidInput.addEventListener("input", () => {
    cid = cidInput.value.replace(/\D/g, "").slice(0, 7);
    cidInput.value = cid;
    refreshState();
  });

  // blocco extra: se per qualunque motivo il link è disabilitato, niente invio
  [wa, mail].forEach(el => el.addEventListener("click", (e) => {
    if (el.classList.contains("disabled")) { e.preventDefault(); cidInput.focus(); }
  }));

  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (p) => {
        const lat = p.coords.latitude.toFixed(6);
        const lon = p.coords.longitude.toFixed(6);
        const acc = Math.round(p.coords.accuracy);
        const maps = `https://maps.google.com/?q=${lat},${lon}`;
        posLine = `Posizione: ${lat}, ${lon} (±${acc} m)\nMappa: ${maps}`;
        document.getElementById("geo").innerHTML =
          `📍 <a href="${maps}" target="_blank">${lat}, ${lon}</a> (±${acc} m)`;
        geoReady = true;
        refreshState();
      },
      (err) => {
        posLine = "Posizione: non disponibile";
        document.getElementById("geo").textContent = "📍 Posizione non disponibile";
        geoReady = true;   // si invia comunque, senza coordinate
        refreshState();
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  } else {
    posLine = "Posizione: non supportata dal dispositivo";
    document.getElementById("geo").textContent = "📍 Geolocalizzazione non supportata";
    geoReady = true;
    refreshState();
  }

  refreshState();
</script>
</body>
</html>
